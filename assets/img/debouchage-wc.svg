  <path d="M0 340h640v80H0z" fill="#cfe2ec"/>
  <!-- réservoir -->
  <rect x="176" y="86" width="150" height="94" rx="10" fill="#fff" stroke="#0b3d5c" stroke-width="6"/>
  <rect x="272" y="104" width="34" height="16" rx="5" fill="#12a5b8"/>
