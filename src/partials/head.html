<!doctype html>
<html lang="fr" data-ga="{{GA4_ID}}" data-gtm="{{GTM_ID}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{PAGE_DESC}}">
<link rel="canonical" href="{{PAGE_URL}}">
<meta name="robots" content="{{ROBOTS_POLICY}}, follow, max-image-preview:large">
<meta name="theme-color" content="#0f172a">
<meta name="format-detection" content="telephone=yes">
<meta name="geo.region" content="FR-BRE">
{{BLOC_VERIFICATION}}

<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="{{NOM_COMMERCIAL}}">
<meta property="og:title" content="{{PAGE_TITLE}}">
<meta property="og:description" content="{{PAGE_DESC}}">
<meta property="og:url" content="{{PAGE_URL}}">
<meta property="og:image" content="{{BASE_URL}}{{PAGE_IMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{NOM_COMMERCIAL}} — {{BASELINE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{PAGE_TITLE}}">
<meta name="twitter:description" content="{{PAGE_DESC}}">
<meta name="twitter:image" content="{{BASE_URL}}{{PAGE_IMAGE}}">

<link rel="icon" href="/assets/img/favicon.svg?v={{V_ICONES}}" type="image/svg+xml">
<link rel="icon" href="/assets/img/favicon.ico?v={{V_ICONES}}" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png?v={{V_ICONES}}">
<link rel="manifest" href="/manifest.webmanifest?v={{V_ICONES}}">
<!-- Les deux familles variables sont servies depuis ce domaine. Les
     précharger évite le saut de police sur le H1, qui est l'élément LCP. -->
<link rel="preload" href="/assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/jakarta-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/style.css?v={{V_CSS}}">

<!-- Active l'apparition au défilement. Placé ici, et non dans site.js qui est
     différé, pour que l'état initial soit posé avant le premier rendu : sinon
     les blocs s'affichent puis disparaissent. Sans JavaScript, la classe n'est
     jamais posée et rien n'est masqué. -->
<script>try{if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&'IntersectionObserver' in window){document.documentElement.className+=' anim'}}catch(e){}</script>
