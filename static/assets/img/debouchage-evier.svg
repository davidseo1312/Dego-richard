<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img"
     aria-label="Évier de cuisine bouché, siphon démonté sous le meuble et seau de récupération">
  <rect width="640" height="420" rx="12" fill="#e4f0f6"/>
  <!-- plan de travail -->
  <rect x="40" y="120" width="560" height="26" rx="6" fill="#0b3d5c"/>
  <!-- cuve -->
  <path d="M180 146h230v96a20 20 0 0 1-20 20H200a20 20 0 0 1-20-20z" fill="#fff" stroke="#0b3d5c" stroke-width="6"/>
  <ellipse cx="295" cy="200" rx="52" ry="14" fill="#12a5b8" opacity=".6"/>
  <!-- robinet -->
  <path d="M448 120V74c0-16-14-28-32-28s-32 12-32 28v10" fill="none" stroke="#0b3d5c" stroke-width="9" stroke-linecap="round"/>
  <path d="M384 92v14" stroke="#12a5b8" stroke-width="9" stroke-linecap="round"/>
  <!-- siphon démonté -->
  <g fill="none" stroke="#ff7a1a" stroke-width="11" stroke-linecap="round">
    <path d="M295 262v40"/>
    <path d="M295 302c-34 0-34 52 0 52s34-40 62-40h44"/>
