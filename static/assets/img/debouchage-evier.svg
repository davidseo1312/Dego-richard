  <!-- graisse dans le siphon -->
  <circle cx="295" cy="330" r="10" fill="#8a6d3b" opacity=".7"/>
  <circle cx="312" cy="336" r="6" fill="#8a6d3b" opacity=".5"/>
  <!-- seau -->
  <path d="M156 320h84l-12 78h-60z" fill="#0b3d5c"/>
  <path d="M156 320h84" stroke="#12a5b8" stroke-width="8" stroke-linecap="round"/>
  <path d="M0 398h640v22H0z" fill="#cfe2ec"/>
</svg>
